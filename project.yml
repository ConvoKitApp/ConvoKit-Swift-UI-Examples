name: ConvoKitSwiftExample
options:
  bundleIdPrefix: app.convokit.examples
  deploymentTarget:
    iOS: "15.0"
packages:
  ConvoKit:
    url: https://github.com/ConvoKitApp/ConvoKit-Swift-Package
    exactVersion: 0.10.1
targets:
  ConvoKitSwiftExample:
    type: application
    platform: iOS
    sources:
      - ConvoKitExample/Sources
    dependencies:
      - package: ConvoKit
        product: ConvoKit
      - package: ConvoKit
        product: ConvoKitUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.convokit.examples.swiftui
        PRODUCT_NAME: ConvoKit Swift
        # The display name has a space in it; naming the module explicitly is
        # what lets the tests below say `@testable import ConvoKitSwiftExample`.
        PRODUCT_MODULE_NAME: ConvoKitSwiftExample
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.10.1
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ConvoKit Swift
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: 1
        CODE_SIGNING_ALLOWED: NO
  ConvoKitSwiftExampleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ConvoKitExample/Tests
    dependencies:
      - target: ConvoKitSwiftExample
      - package: ConvoKit
        product: ConvoKit
      - package: ConvoKit
        product: ConvoKitUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.convokit.examples.swiftui.tests
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        # The host app's PRODUCT_NAME has a space in it, so the generated
        # default host path (which follows the target name) does not exist.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ConvoKit Swift.app/ConvoKit Swift"
schemes:
  ConvoKitSwiftExample:
    build:
      targets:
        ConvoKitSwiftExample: all
        ConvoKitSwiftExampleTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ConvoKitSwiftExampleTests
