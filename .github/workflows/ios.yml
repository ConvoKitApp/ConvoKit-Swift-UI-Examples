name: iOS example

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build example from the public binary package
        run: xcodebuild -project ConvoKitSwiftExample.xcodeproj -scheme ConvoKitSwiftExample -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Test the showcase room state
        run: |
          udid=$(xcrun simctl list devices available | grep -m1 -E '^ +iPhone' | grep -oE '[0-9A-F-]{36}')
          xcodebuild test -project ConvoKitSwiftExample.xcodeproj -scheme ConvoKitSwiftExample -destination "id=$udid" CODE_SIGNING_ALLOWED=NO
